<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facility Tracker</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #070b10;

    color: #d8e0e8;

    font-family: Arial, Helvetica, sans-serif;

    padding: 20px;
}


/* =========================================
   MAIN WINDOW
========================================= */

.app {

    width: 100%;
    max-width: 1200px;

    min-height: calc(100vh - 40px);

    margin: auto;

    background: #101922;

    border: 1px solid #293d4e;

    border-radius: 10px;

    overflow: hidden;

    box-shadow: 0 20px 60px #0008;
}


/* =========================================
   HEADER
========================================= */

header {

    height: 72px;

    display: flex;

    align-items: center;

    gap: 14px;

    padding: 12px 18px;

    background:
        linear-gradient(
            180deg,
            #192530,
            #121b24
        );

    border-bottom: 1px solid #293d4e;
}


.logo {

    width: 38px;
    height: 38px;

    border: 1px solid #a66b20;

    border-radius: 8px;

    display: flex;

    align-items: center;
    justify-content: center;

    color: #f2a23d;

    font-size: 12px;

    font-weight: bold;
}


.heading h1 {

    margin: 0;

    font-size: 16px;
}


.heading small {

    display: block;

    margin-top: 5px;

    color: #71869a;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;
}


.header-info {

    margin-left: auto;

    display: flex;

    gap: 25px;

    font-size: 9px;

    color: #71869a;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.header-info b {

    display: block;

    margin-top: 3px;

    font-size: 18px;

    color: #e8752b;
}


.header-info .blue b {

    color: #3f8cff;
}


.close {

    width: 36px;
    height: 36px;

    border: 1px solid #30485b;

    border-radius: 8px;

    background: #1b2732;

    color: #aab9c6;

    font-size: 18px;
}


/* =========================================
   MAIN CONTENT
========================================= */

.content {

    display: grid;

    grid-template-columns: 1fr 300px;

    min-height: calc(100vh - 112px);
}


.main {

    padding: 16px;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =========================================
   MAIN IMAGE
========================================= */

.main-image {

    width: 100%;

    height: 650px;

    max-height: calc(100vh - 145px);

    min-height: 450px;

    border: 1px solid #314657;

    border-radius: 8px;

    background:
      background-image: url("mrc.png");
background-size: cover;
background-position: center;

    background-size: cover;

    background-position: center;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    position: relative;
}





/* =========================================
   SIDE PANEL
========================================= */

.side {

    border-left: 1px solid #293d4e;

    background: #0e161f;
}


.side-title {

    height: 48px;

    padding: 16px 14px;

    border-bottom: 1px solid #1d2c39;

    color: #71869a;

    font-size: 11px;

    letter-spacing: 1.4px;

    text-transform: uppercase;
}


.slots {

    padding: 10px;

    display: flex;

    flex-direction: column;

    gap: 8px;
}


.slot {

    width: 100%;

    min-height: 78px;

    text-align: left;

    padding: 13px;

    border: 1px solid #1d2b38;

    border-radius: 7px;

    background:
        linear-gradient(
            180deg,
            #141e28,
            #111922
        );

    color: #d8e0e8;

    cursor: pointer;

    transition: 0.15s;
}


.slot:hover {

    border-color: #3c5a70;

    background: #17232e;

    transform: translateX(-2px);
}


.slot-title {

    font-size: 13px;

    font-weight: bold;
}


.slot-description {

    margin-top: 7px;

    color: #73899b;

    font-size: 10px;
}


.slot-tag {

    float: right;

    color: #e8752b;

    border: 1px solid #9a4e21;

    border-radius: 10px;

    padding: 3px 7px;

    font-size: 8px;
}


/* =========================================
   PROFILE POPUP
========================================= */

.overlay {

    position: fixed;

    inset: 0;

    background: #030609cc;

    backdrop-filter: blur(5px);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 100;
}


.overlay.active {

    display: flex;
}


.profile {

    width: 650px;

    max-width: 100%;

    max-height: 90vh;

    overflow-y: auto;

    background: #101923;

    border: 1px solid #304555;

    border-radius: 10px;

    box-shadow: 0 25px 90px #000b;

    overflow-x: hidden;
}


/* =========================================
   PROFILE HEADER
========================================= */

.profile-header {

    display: flex;

    align-items: center;

    padding: 16px 18px;

    background:
        linear-gradient(
            180deg,
            #18242e,
            #121c25
        );

    border-bottom: 1px solid #233441;
}


.profile-header h2 {

    margin: 0;

    font-size: 18px;
}


.profile-close {

    margin-left: auto;

    width: 32px;
    height: 32px;

    border: 1px solid #304352;

    border-radius: 7px;

    background: #1a2731;

    color: #a9b8c5;

    cursor: pointer;
}


/* =========================================
   PROFILE CONTENT
========================================= */

.profile-body {

    padding: 18px;
}


/* TOP SECTION
   PHOTO LEFT
   NAME + SHORT TEXT RIGHT
========================================= */

.profile-top {

    display: flex;

    gap: 18px;

    align-items: flex-start;
}


/* SMALL PHOTO */

.profile-image {

    width: 150px;

    height: 150px;

    flex-shrink: 0;

    border: 1px solid #2d4353;

    border-radius: 7px;

    background: #0c141b;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    color: #536879;

    font-size: 9px;

    letter-spacing: 1px;
}


.profile-image img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: none;
}


/* RIGHT SIDE */

.profile-info {

    flex: 1;
}


.profile-name {

    font-size: 20px;

    font-weight: bold;

    color: #e0e6ec;

    margin-bottom: 12px;
}


/* SMALL PARAGRAPH */

.short-text {

    padding: 11px;

    background: #0c141c;

    border-left: 2px solid #3f8cff;

    color: #aebbc6;

    font-size: 12px;

    line-height: 1.6;

    min-height: 70px;
}


/* =========================================
   LARGE PARAGRAPH
========================================= */

.long-text {

    margin-top: 18px;

    padding: 15px;

    min-height: 190px;

    background: #0c141c;

    border: 1px solid #253846;

    border-left: 2px solid #e8752b;

    border-radius: 5px;

    color: #aebbc6;

    font-size: 13px;

    line-height: 1.7;

    white-space: pre-line;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width: 800px) {

    body {

        padding: 0;
    }

    .app {

        min-height: 100vh;

        border-radius: 0;
    }

    .content {

        grid-template-columns: 1fr;
    }

    .side {

        border-left: 0;

        border-top: 1px solid #293d4e;
    }

    .main-image {

        height: 55vh;

        min-height: 350px;
    }
}


@media(max-width: 500px) {

    .profile-top {

        flex-direction: column;
    }

    .profile-image {

        width: 130px;

        height: 130px;
    }
}

</style>
</head>


<body>


<div class="app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header>

        <div class="logo">
            MRC
        </div>


        <div class="heading">

            <h1>
                Facility Tracker
            </h1>

            <small>
                Melbourne Remand Centre · Information
            </small>

        </div>


        <div class="header-info">

            <div>
                Entries
                <b>02</b>
            </div>

            <div class="blue">
                Active
                <b>02</b>
            </div>

        </div>


        <button class="close"
                onclick="location.reload()">

            ×

        </button>

    </header>



    <!-- =====================================
         CONTENT
    ====================================== -->

    <div class="content">


        <!-- MAIN IMAGE -->

        <main class="main">

            <div class="main-image">
            </div>

        </main>



        <!-- SIDE PANEL -->

        <aside class="side">

            <div class="side-title">
                Profiles
            </div>


            <div class="slots">


                <!-- SLOT ONE -->

                <button
                    class="slot"
                    onclick="openProfile(1)"
                >

                    <span class="slot-tag">
                        OPEN
                    </span>

                    <div class="slot-title">
                        Profile One
                    </div>

                    <div class="slot-description">
                        Click to view information
                    </div>

                </button>



                <!-- SLOT TWO -->

                <button
                    class="slot"
                    onclick="openProfile(2)"
                >

                    <span class="slot-tag">
                        OPEN
                    </span>

                    <div class="slot-title">
                        Profile Two
                    </div>

                    <div class="slot-description">
                        Click to view information
                    </div>

                </button>


            </div>

        </aside>

    </div>

</div>



<!-- =========================================
     PROFILE POPUP
========================================= -->

<div
    class="overlay"
    id="profileOverlay"
>


    <div class="profile">


        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <h2 id="profileTitle">
                Profile
            </h2>

            <button
                class="profile-close"
                onclick="closeProfile()"
            >
                ×
            </button>

        </div>



        <div class="profile-body">


            <!-- =================================
                 TOP PROFILE AREA
            ================================== -->

            <div class="profile-top">


                <!-- PHOTO -->

                <div class="profile-image">

                    <span id="imagePlaceholder">
                        PROFILE IMAGE
                    </span>

                    <img
                        id="profileImage"
                        src=""
                        alt=""
                    >

                </div>



                <!-- NAME + SMALL PARAGRAPH -->

                <div class="profile-info">


                    <div
                        class="profile-name"
                        id="profileName"
                    >
                        Name
                    </div>


                    <div
                        class="short-text"
                        id="profileShort"
                    >
                        Short information goes here.
                    </div>


                </div>

            </div>



            <!-- =================================
                 LARGE INFORMATION AREA
            ================================== -->

            <div
                class="long-text"
                id="profileLong"
            >
                Longer information goes here.
            </div>


        </div>

    </div>

</div>



<script>


/* ==================================================
   EDIT YOUR PROFILES HERE
==================================================

   Each profile has:

   title
   image
   short
   long

   "title" = popup title

   "image" = profile picture URL

   "short" = small paragraph beside picture

   "long" = larger paragraph underneath

   You can use multiple lines in "long".

================================================== */


const profiles = {


    1: {

        title: "Profile One",

        image: "",

        short:
            "Short information about this person goes here.",

        long:
`This is the larger information section.

You can write several lines here.

You can add as much information as you want.

This section is designed for longer descriptions, records, notes, background information, or whatever you want to put here.`

    },


    2: {

        title: "Profile Two",

        image: "",

        short:
            "Short information about this person goes here.",

        long:
`This is the larger information section for Profile Two.

You can use multiple paragraphs.

Each line will stay separated because the website uses white-space formatting.

Add as much information as needed here.`

    }

};



/* ==================================================
   OPEN PROFILE
================================================== */

function openProfile(number) {

    const profile = profiles[number];


    document.getElementById("profileTitle").textContent =
        profile.title;


    document.getElementById("profileName").textContent =
        profile.title;


    document.getElementById("profileShort").textContent =
        profile.short;


    document.getElementById("profileLong").textContent =
        profile.long;



    const image =
        document.getElementById("profileImage");


    const placeholder =
        document.getElementById("imagePlaceholder");



    if (profile.image !== "") {

        image.src = profile.image;

        image.style.display = "block";

        placeholder.style.display = "none";

    }

    else {

        image.src = "";

        image.style.display = "none";

        placeholder.style.display = "block";

    }



    document
        .getElementById("profileOverlay")
        .classList
        .add("active");

}



/* ==================================================
   CLOSE PROFILE
================================================== */

function closeProfile() {

    document
        .getElementById("profileOverlay")
        .classList
        .remove("active");

}



/* CLOSE WHEN CLICKING OUTSIDE */

document
    .getElementById("profileOverlay")
    .addEventListener(
        "click",
        function(event) {

            if (event.target === this) {

                closeProfile();

            }

        }
    );



/* ESCAPE KEY */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            closeProfile();

        }

    }
);

</script>

</body>
</html>
