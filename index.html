<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facility Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #070b10;
    color: #d8e0e8;
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
}

.app {
    width: 100%;
    max-width: 1200px;
    min-height: calc(100vh - 40px);
    margin: auto;
    background: #101922;
    border: 1px solid #293d4e;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px #0008;
}

/* HEADER */

header {
    height: 72px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    background: linear-gradient(180deg, #192530, #121b24);
    border-bottom: 1px solid #293d4e;
}

.logo {
    width: 38px;
    height: 38px;
    border: 1px solid #a66b20;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f2a23d;
    font-size: 12px;
    font-weight: bold;
}

.heading h1 {
    margin: 0;
    font-size: 16px;
}

.heading small {
    display: block;
    margin-top: 5px;
    color: #71869a;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.header-info {
    margin-left: auto;
    display: flex;
    gap: 25px;
    font-size: 9px;
    color: #71869a;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.header-info b {
    display: block;
    margin-top: 3px;
    font-size: 18px;
    color: #e8752b;
}

.header-info .blue b {
    color: #3f8cff;
}

.close {
    width: 36px;
    height: 36px;
    border: 1px solid #30485b;
    border-radius: 8px;
    background: #1b2732;
    color: #aab9c6;
    font-size: 18px;
}

/* MAIN */

.content {
    display: grid;
    grid-template-columns: 1fr 300px;
    min-height: calc(100vh - 112px);
}

.main {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.main-image {
    width: 100%;
    height: 650px;
    max-height: calc(100vh - 145px);
    min-height: 450px;

    border: 1px solid #314657;
    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #18242d,
            #0d151d 45%,
            #172530
        );

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
    position: relative;
}

/*
==================================================
MAIN IMAGE
==================================================

Replace the URL below with your image.

Example:

background-image: url("https://example.com/image.jpg");

*/

.main-image {
    background-image: url("");
    background-size: cover;
    background-position: center;
}

.main-image::after {
    content: "MAIN IMAGE";
    color: #566b7c;
    font-size: 12px;
    letter-spacing: 3px;
    border: 1px dashed #344b5d;
    padding: 20px 30px;
    border-radius: 6px;
}

/* SIDE PANEL */

.side {
    border-left: 1px solid #293d4e;
    background: #0e161f;
}

.side-title {
    height: 48px;
    padding: 16px 14px;
    border-bottom: 1px solid #1d2c39;
    color: #71869a;
    font-size: 11px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
}

.slots {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.slot {
    width: 100%;
    min-height: 78px;

    text-align: left;

    padding: 13px;

    border: 1px solid #1d2b38;
    border-radius: 7px;

    background: linear-gradient(
        180deg,
        #141e28,
        #111922
    );

    color: #d8e0e8;

    cursor: pointer;

    transition: 0.15s;
}

.slot:hover {
    border-color: #3c5a70;
    background: #17232e;
    transform: translateX(-2px);
}

.slot-title {
    font-size: 13px;
    font-weight: bold;
}

.slot-description {
    margin-top: 7px;
    color: #73899b;
    font-size: 10px;
}

.slot-tag {
    float: right;
    color: #e8752b;
    border: 1px solid #9a4e21;
    border-radius: 10px;
    padding: 3px 7px;
    font-size: 8px;
}

/* PROFILE WINDOW */

.overlay {
    position: fixed;
    inset: 0;

    background: #030609cc;
    backdrop-filter: blur(5px);

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.overlay.active {
    display: flex;
}

.profile {
    width: 560px;
    max-width: 100%;

    background: #101923;

    border: 1px solid #304555;
    border-radius: 10px;

    box-shadow: 0 25px 90px #000b;

    overflow: hidden;
}

/* PROFILE HEADER */

.profile-header {
    display: flex;
    align-items: center;

    padding: 16px 18px;

    background: linear-gradient(
        180deg,
        #18242e,
        #121c25
    );

    border-bottom: 1px solid #233441;
}

.profile-header h2 {
    margin: 0;
    font-size: 18px;
}

.profile-close {
    margin-left: auto;

    width: 32px;
    height: 32px;

    border: 1px solid #304352;
    border-radius: 7px;

    background: #1a2731;
    color: #a9b8c5;

    cursor: pointer;
}

/* PROFILE BODY */

.profile-body {
    padding: 18px;
}

.profile-image {
    width: 100%;
    height: 190px;

    border: 1px solid #2d4353;
    border-radius: 7px;

    background: #0c141b;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    color: #536879;
    font-size: 10px;
    letter-spacing: 2px;
}

.profile-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: none;
}

.profile-text {
    margin-top: 16px;

    padding: 14px;

    border-left: 2px solid #e8752b;

    background: #0c141c;

    color: #aebbc6;

    font-size: 13px;
    line-height: 1.7;
}

/* MOBILE */

@media(max-width: 800px) {

    body {
        padding: 0;
    }

    .app {
        min-height: 100vh;
        border-radius: 0;
    }

    .content {
        grid-template-columns: 1fr;
    }

    .side {
        border-left: 0;
        border-top: 1px solid #293d4e;
    }

    .main-image {
        height: 55vh;
        min-height: 350px;
    }
}
</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div class="logo">
            MRC
        </div>

        <div class="heading">

            <h1>
                Facility Tracker
            </h1>

            <small>
                Melbourne Remand Centre · Information
            </small>

        </div>

        <div class="header-info">

            <div>
                Entries
                <b>02</b>
            </div>

            <div class="blue">
                Active
                <b>02</b>
            </div>

        </div>

        <button class="close" onclick="location.reload()">
            ×
        </button>

    </header>


    <!-- MAIN CONTENT -->

    <div class="content">


        <!-- BIG IMAGE -->

        <main class="main">

            <div class="main-image">
            </div>

        </main>


        <!-- SIDE PANEL -->

        <aside class="side">

            <div class="side-title">
                Profiles
            </div>


            <div class="slots">


                <!-- SLOT ONE -->

                <button class="slot" onclick="openProfile(1)">

                    <span class="slot-tag">
                        OPEN
                    </span>

                    <div class="slot-title">
                        Profile One
                    </div>

                    <div class="slot-description">
                        Click to view information
                    </div>

                </button>


                <!-- SLOT TWO -->

                <button class="slot" onclick="openProfile(2)">

                    <span class="slot-tag">
                        OPEN
                    </span>

                    <div class="slot-title">
                        Profile Two
                    </div>

                    <div class="slot-description">
                        Click to view information
                    </div>

                </button>


            </div>

        </aside>

    </div>

</div>



<!-- PROFILE POPUP -->

<div class="overlay" id="profileOverlay">

    <div class="profile">


        <div class="profile-header">

            <h2 id="profileTitle">
                Profile
            </h2>

            <button
                class="profile-close"
                onclick="closeProfile()"
            >
                ×
            </button>

        </div>


        <div class="profile-body">


            <div class="profile-image">

                <span id="imagePlaceholder">
                    PROFILE IMAGE
                </span>

                <img
                    id="profileImage"
                    src=""
                    alt=""
                >

            </div>


            <div
                class="profile-text"
                id="profileText"
            >
                Profile information goes here.
            </div>


        </div>

    </div>

</div>



<script>

/*
==================================================
EDIT YOUR PROFILES HERE
==================================================

title = title shown at the top

image = image URL

text = paragraph underneath the image

You can use a direct image URL such as:

https://example.com/image.jpg

Leave image as "" for an empty image box.

==================================================
*/

const profiles = {

    1: {

        title: "Profile One",

        image: "",

        text:
            "This is the first profile. Replace this paragraph with whatever information you want displayed here."

    },


    2: {

        title: "Profile Two",

        image: "",

        text:
            "This is the second profile. Replace this paragraph with whatever information you want displayed here."

    }

};



/*
==================================================
DO NOT NEED TO EDIT BELOW THIS
==================================================
*/

function openProfile(number) {

    const profile = profiles[number];

    document.getElementById("profileTitle").textContent =
        profile.title;

    document.getElementById("profileText").textContent =
        profile.text;


    const image =
        document.getElementById("profileImage");

    const placeholder =
        document.getElementById("imagePlaceholder");


    if (profile.image !== "") {

        image.src = profile.image;

        image.style.display = "block";

        placeholder.style.display = "none";

    } else {

        image.src = "";

        image.style.display = "none";

        placeholder.style.display = "block";

    }


    document
        .getElementById("profileOverlay")
        .classList
        .add("active");
}


function closeProfile() {

    document
        .getElementById("profileOverlay")
        .classList
        .remove("active");

}


/* Close when clicking outside the profile */

document
    .getElementById("profileOverlay")
    .addEventListener("click", function(event) {

        if (event.target === this) {

            closeProfile();

        }

    });


/* Close with ESC */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closeProfile();

    }

});

</script>

</body>
</html>
